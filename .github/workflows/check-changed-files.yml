name: Validate Pull Request

# SECURITY: Never check out, source, or execute the PR revision in this workflow. It may only be inspected as Git data.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency: # Only one job per PR at a time
  group: pr-${{ github.event.pull_request.number }}-validation
  cancel-in-progress: true # cancel any in-progress runs when a new commit is pushed

permissions:
  contents: read

jobs:
  check-changed-files:
    name: Check for Changes Outside Allowed Path
    runs-on: ubuntu-latest
    steps:
      # Check out only the trusted base commit. The PR's files are never placed in the working tree of this privileged pull_request_target workflow.
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history is needed to find where an older PR diverged from the current base branch.
          fetch-depth: 0
          persist-credentials: false

      # Fetch the PR commit into Git's object database without checking it out.
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

          ACTUAL_HEAD="$(git rev-parse FETCH_HEAD)"
          if [[ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Fetched PR head does not match the triggering commit"
            exit 1
          fi

      # Fail in case of changes outside of `data/birth-dates/*.txt`
      - name: Check Changed Files
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Compare from the point where the PR diverged. Comparing the current base tip directly with an older PR head would 
          # incorrectly include newer base-branch changes as if the PR had made them.
          if ! MERGE_BASE="$(git merge-base "$BASE" "$HEAD")" || [[ -z "$MERGE_BASE" ]]; then
            echo "::error::Could not find a common ancestor for the base and PR commits"
            echo "Could not determine the PR's merge base." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD")"
          echo -e "Changed files: \n${CHANGED_FILES}"

          if [[ -z "${CHANGED_FILES}" ]]; then
            exit 0
          fi

          # Find any changed files not in the allowed path:
          DISALLOWED_FILES="$(echo "${CHANGED_FILES}" | grep -Ev '^data/birth-dates/[^/]+\.txt$' || true)"

          if [[ -n "${DISALLOWED_FILES}" ]]; then
            echo "::error::Disallowed changes detected!"
            echo "Disallowed changes detected:" >> "$GITHUB_STEP_SUMMARY"
            echo "${DISALLOWED_FILES}" >> "$GITHUB_STEP_SUMMARY"
            echo "Only files directly under data/birth-dates/ with .txt extension may be edited." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All changes are within data/birth-dates/*.txt"

  check-birthdates:
    needs: check-changed-files
    runs-on: ubuntu-latest
    steps:
      # Check out only the trusted base commit. The PR's files are never placed in the working tree of this privileged pull_request_target workflow.
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # The validator needs the common ancestor of the base and PR commits.
          fetch-depth: 0
          persist-credentials: false

      # Fetch the PR commit into Git's object database without checking it out.
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

          ACTUAL_HEAD="$(git rev-parse FETCH_HEAD)"
          if [[ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Fetched PR head does not match the triggering commit"
            exit 1
          fi

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/workflows/validate_birthdates.sh
